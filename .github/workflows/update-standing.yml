yaml
name: Update standings

on:
  schedule:
    - cron: "17 12 * * *"   # daily, 7:17 AM Central (6:17 during standard time)
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch standings
        run: python scripts/update_standings.py
      - name: Commit if changed
        run: |
          git config user.name "standings-bot"
          git config user.email "standings-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Standings $(date -u +%F)"
          git push
